<!doctype html>
<html lang="en">
  <head>

    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"

            <a
              class="nav-link"

          </li>

            <a

              href="/smartphones"

            </a>

            <a
              class="nav-link"

            </a>
          </li>
          <li class="list-item">
            <a
              class="nav-link"
              href="/tablets"
            >
              Tablets
            </a>
          </li>
          <li class="list-item">
            <a
              class="nav-link"
              href="/photo"
            >
              Photo
            </a>
          </li>
          <li class="list-item">
            <a
              class="nav-link"
              href="/video"
